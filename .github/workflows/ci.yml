name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `all` is the curated convenience feature; it excludes the platform-specific
      # GPU features (metal/cuda), which cannot build on the Linux runner. Using
      # `--all-features` here would pull macOS-only Candle Metal crates and fail.
      - name: Clippy (all features)
        run: cargo clippy -p embedd --all-targets --features all -- -D warnings

  # Feature combination matrix -- the main risk surface for this crate.
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--features simd"
          - "--features candle-hf"
          - "--features fastembed"
          - "--features openai"
          - "--features tei"
          - "--features hf-inference"
          - "--features async-openai"
          - "--features async-tei"
          - "--features async-hf-inference"
          - "--features ort-tokenizers"
          - "--features serde"
          - "--features qdrant"
          - "--features openai,cli"
          # `all` excludes the macOS/NVIDIA-only metal/cuda features, which cannot
          # build on the Linux runner; they are verified locally.
          - "--features all"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check ${{ matrix.features }}
        run: cargo check -p embedd ${{ matrix.features }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Test (workspace, default features)
        run: cargo test --workspace

      - name: Test vector backends (SIMD)
        run: cargo test -p embedd --features simd --test vector_backend --test normalization_policy

      - name: Default external consumer excludes innr
        shell: bash
        run: |
          probe=$(mktemp -d)
          cargo init --lib --name embedd_consumer "$probe"
          printf '\nembedd = { path = "%s/crates/embedd" }\n' "$GITHUB_WORKSPACE" >> "$probe/Cargo.toml"
          cargo tree --manifest-path "$probe/Cargo.toml" --edges normal,build --prefix none > "$probe/tree.txt"
          if grep -q '^innr v' "$probe/tree.txt"; then
            cat "$probe/tree.txt"
            exit 1
          fi

      - name: Test (embedd, fastembed)
        run: cargo test -p embedd --features fastembed

      - name: Examples compile
        run: cargo build -p embedd --examples --features fastembed

      - name: Semver check
        if: github.event_name == 'pull_request'
        run: |
          cargo install cargo-semver-checks --version 0.51.0 --locked
          cargo semver-checks -p embedd --baseline-version 0.4.0 --default-features --features all

  vector-consumer-msrv:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        backend:
          - {toolchain: "1.80.0", feature: ""}
          - {toolchain: "1.89.0", feature: "simd"}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.backend.toolchain }}
      - name: Check external consumer at the backend's Rust floor
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.backend.toolchain }}
          BACKEND_FEATURE: ${{ matrix.backend.feature }}
        run: |
          probe=$(mktemp -d)
          mkdir "$probe/src"
          printf '[package]\nname="embedd_msrv_consumer"\nversion="0.0.0"\nedition="2021"\n[dependencies]\nembedd={path="%s/crates/embedd",features=[%s]}\n' \
            "$GITHUB_WORKSPACE" "${BACKEND_FEATURE:+\"$BACKEND_FEATURE\"}" > "$probe/Cargo.toml"
          printf 'fn main() { assert_eq!(embedd::vector::dot_f32(&[1.0], &[2.0]), 2.0); }\n' > "$probe/src/main.rs"
          RUSTC="$(rustup which --toolchain "$TOOLCHAIN" rustc)"
          RUSTDOC="$(rustup which --toolchain "$TOOLCHAIN" rustdoc)"
          export RUSTC RUSTDOC
          "$RUSTC" --version
          "$(rustup which --toolchain "$TOOLCHAIN" cargo)" run --manifest-path "$probe/Cargo.toml"
