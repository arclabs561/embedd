name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy -p embedd --all-targets --all-features -- -D warnings

  # Feature combination matrix -- the main risk surface for this crate.
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--features candle-hf"
          - "--features fastembed"
          - "--features openai"
          - "--features tei"
          - "--features hf-inference"
          - "--features async-openai"
          - "--features async-tei"
          - "--features async-hf-inference"
          - "--features ort-tokenizers"
          - "--features serde"
          - "--features qdrant"
          - "--features openai,cli"
          - "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check ${{ matrix.features }}
        run: cargo check -p embedd ${{ matrix.features }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test (workspace, default features)
        run: cargo test --workspace

      - name: Test (embedd, fastembed)
        run: cargo test -p embedd --features fastembed

      - name: Examples compile
        run: cargo build -p embedd --examples --features fastembed

      - name: Semver check
        if: github.event_name == 'pull_request'
        run: |
          cargo install cargo-semver-checks --locked || true
          cargo semver-checks -p embedd
